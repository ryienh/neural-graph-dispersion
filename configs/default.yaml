# Default settings: N=16, k=100, all four metrics from one training run.

n_vertices: 16
k_select: 100
metrics: [gcd, netlsd_heat, netlsd_wave, portrait_div]

num_ensembles: 80
hidden_dim: 256
num_hidden: 6
latent_dim: 16

batch_size: 100
num_iterations: 5000
learning_rate: 0.00023995817958282425
num_samples_ste: 25
gamma: 0.2
epsilon: 0.001
training_budget: 10000

features: [regularity_proxy, clustering_proxy, adj_m3_norm, adj_m2_norm]
projection_dim: 4
direction_seed: 42

sampling_budget: 100000
n_top_matrices: 1000
