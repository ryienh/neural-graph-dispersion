[project]
name = "neural-graph-dispersion"
version = "1.0.0"
description = "Neural Dispersion on Graphs: generating maximally diverse sets of graphs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ryien Hosseini", email = "ryienh@umich.edu" }]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "netlsd>=1.0.2",
    "joblib>=1.3",
    "tqdm>=4.65",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ngd*"]

[tool.ruff]
line-length = 110
target-version = "py310"
